<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>クロノ</title>
<meta name="description" content="1/100秒まで計測できるストップウォッチ">
<meta name="theme-color" content="#e9ecef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="クロノ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@300;500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: クロノグラフの文字盤を主役に、右(狭い画面では下)にデジタル表示とラップ表 */
:root {
  --bg: #e9ecef;
  --dial: #fbfbf8;
  --ink: #1b2330;
  --muted: #687284;
  --line: #cfd5dd;
  --blued: #2b4c9b;      /* 焼き入れ青針 */
  --blued-soft: #dfe6f5;
  --good: #1f7a4d;
  --bad: #b2402f;
  --shadow: 0 1px 0 #fff inset, 0 18px 40px -22px rgba(27,35,48,.45);
  --f-digit: "Azeret Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --dial: #1b212b; --ink: #e6e9ee; --muted: #8b95a6; --line: #2c3442;
    --blued: #7da0ec; --blued-soft: #24324f; --good: #5cc28f; --bad: #ef8a76;
    --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -22px rgba(0,0,0,.8);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --dial: #1b212b; --ink: #e6e9ee; --muted: #8b95a6; --line: #2c3442;
  --blued: #7da0ec; --blued-soft: #24324f; --good: #5cc28f; --bad: #ef8a76;
  --shadow: 0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -22px rgba(0,0,0,.8);
  color-scheme: dark;
}
html { background: var(--bg); color-scheme: light; -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100vh; min-height: 100dvh;
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: max(28px, calc(env(safe-area-inset-top, 0px) + 12px));
  padding-bottom: max(28px, calc(env(safe-area-inset-bottom, 0px) + 12px));
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior-y: none;
}
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.readout, .current-lap { -webkit-user-select: none; user-select: none; }
.app {
  max-width: 980px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 40px; align-items: start;
}
@media (max-width: 760px) { .app { grid-template-columns: minmax(0, 1fr); gap: 24px; } }

/* 文字盤 */
.dial-wrap { width: 100%; max-width: 440px; margin: 0 auto; aspect-ratio: 1; }
svg.dial { width: 100%; height: 100%; display: block; overflow: visible; }
.dial .face { fill: var(--dial); stroke: var(--line); stroke-width: 1.5; }
.dial .bezel { fill: none; stroke: var(--ink); stroke-width: 3; opacity: .85; }
.dial .tick { stroke: var(--ink); }
.dial .tick.minor { stroke: var(--muted); }
.dial .num { fill: var(--ink); font-family: var(--f-digit); font-size: 15px; font-weight: 500; text-anchor: middle; dominant-baseline: central; }
.dial .sub-face { fill: none; stroke: var(--line); stroke-width: 1.2; }
.dial .sub-tick { stroke: var(--muted); }
.dial .sub-num { fill: var(--muted); font-family: var(--f-digit); font-size: 9px; text-anchor: middle; dominant-baseline: central; }
.dial .brand { fill: var(--muted); font-family: var(--f-body); font-size: 9px; letter-spacing: .3em; text-anchor: middle; }
.dial .hand { stroke: var(--blued); stroke-linecap: round; }
.dial .hand-sub { stroke: var(--ink); stroke-linecap: round; }
.dial .hub { fill: var(--blued); }
.dial .hub-sub { fill: var(--ink); }
.dial .lap-mark { fill: var(--blued); opacity: .35; }

/* パネル */
.panel { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--muted); margin: 0; }
.readout {
  font-family: var(--f-digit); font-variant-numeric: tabular-nums; font-weight: 300;
  font-size: clamp(44px, 9vw, 68px); line-height: 1; letter-spacing: -.02em; margin: 0;
  white-space: nowrap;
}
.readout .cs { font-size: .55em; color: var(--muted); }
.current-lap { font-family: var(--f-digit); font-variant-numeric: tabular-nums; color: var(--muted); font-size: 15px; margin: 0; }
.current-lap b { color: var(--blued); font-weight: 500; }

.controls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
button {
  font: 700 15px/1 var(--f-body); letter-spacing: .04em;
  border-radius: 999px; padding: 15px 10px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--dial); color: var(--ink);
  transition: transform .08s ease, background .15s ease, border-color .15s ease;
}
button:hover:not(:disabled) { border-color: var(--ink); }
button:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible { outline: 3px solid var(--blued); outline-offset: 2px; }
button:disabled { opacity: .4; cursor: not-allowed; }
button.primary { background: var(--blued); border-color: var(--blued); color: var(--dial); }
button.primary:hover:not(:disabled) { border-color: var(--ink); }
button kbd { display: block; margin-top: 6px; font: 400 10px/1 var(--f-digit); opacity: .7; letter-spacing: 0; }

.laps-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stats { font-size: 12px; color: var(--muted); font-family: var(--f-digit); font-variant-numeric: tabular-nums; }
.laps {
  border-top: 1.5px solid var(--ink); max-height: 320px; overflow-y: auto;
}
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { font: 500 11px var(--f-body); letter-spacing: .12em; color: var(--muted); text-align: right; padding: 10px 6px; position: sticky; top: 0; background: var(--bg); }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--f-digit); font-size: 15px; text-align: right; padding: 10px 6px; border-top: 1px solid var(--line); }
td.idx { color: var(--muted); }
tr.best td.lap { color: var(--good); font-weight: 700; }
tr.worst td.lap { color: var(--bad); font-weight: 700; }
.tag { font: 700 10px var(--f-body); padding: 2px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
tr.best .tag { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
tr.worst .tag { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.empty { color: var(--muted); font-size: 14px; padding: 18px 0; line-height: 1.7; }
.hint { font-size: 12px; color: var(--muted); margin: 0; line-height: 1.7; }

@media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>
</head>
<body>
<main class="app">
  <div class="dial-wrap">
    <svg class="dial" viewBox="0 0 400 400" role="img" aria-label="ストップウォッチの文字盤">
      <circle class="face" cx="200" cy="200" r="190" style="filter: drop-shadow(0 10px 22px rgba(0,0,0,.12))"></circle>
      <circle class="bezel" cx="200" cy="200" r="184"></circle>
      <g id="ticks"></g>
      <g id="lapMarks"></g>
      <!-- 30分積算計 -->
      <g id="sub" transform="translate(200 268)">
        <circle class="sub-face" r="40"></circle>
        <g id="subTicks"></g>
        <line id="subHand" class="hand-sub" x1="0" y1="6" x2="0" y2="-32" stroke-width="2.5"></line>
        <circle class="hub-sub" r="3.5"></circle>
      </g>
      <text class="brand" x="200" y="140">CHRONO · 1/100</text>
      <g id="secHand">
        <line class="hand" x1="200" y1="232" x2="200" y2="30" stroke-width="2.5"></line>
        <circle class="hub" cx="200" cy="232" r="0"></circle>
      </g>
      <circle class="hub" cx="200" cy="200" r="7"></circle>
      <circle cx="200" cy="200" r="2.5" style="fill: var(--dial)"></circle>
    </svg>
  </div>

  <section class="panel" aria-label="計測">
    <p class="eyebrow">経過時間</p>
    <p class="readout" id="readout" aria-live="off">00:00.<span class="cs">00</span></p>
    <p class="current-lap" id="currentLap">ラップ <b>1</b> · 00:00.00</p>

    <div class="controls">
      <button id="btnStart" class="primary" type="button">スタート<kbd>Space</kbd></button>
      <button id="btnLap" type="button" disabled>ラップ<kbd>L</kbd></button>
      <button id="btnReset" type="button" disabled>リセット<kbd>R</kbd></button>
    </div>

    <div>
      <div class="laps-head">
        <p class="eyebrow">ラップ記録</p>
        <span class="stats" id="stats"></span>
      </div>
      <div class="laps" id="laps"></div>
    </div>
    <p class="hint">計測中にアプリを閉じても、次に開いたとき続きから表示されます。</p>
  </section>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const KEY = 'chrono-stopwatch-v1';

  // 状態: 経過時間は「止めた時点までの累積 + 走行中なら開始時刻からの差」
  let state = { acc: 0, startedAt: null, laps: [] }; // laps: 各ラップの累積(スプリット)ms
  try {
    const saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && Array.isArray(saved.laps)) state = saved;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

  const running = () => state.startedAt !== null;
  const elapsed = () => state.acc + (running() ? Date.now() - state.startedAt : 0);

  const fmt = (ms, withHours) => {
    const cs = Math.floor(ms / 10) % 100;
    const s = Math.floor(ms / 1000) % 60;
    const m = Math.floor(ms / 60000) % 60;
    const h = Math.floor(ms / 3600000);
    const p = n => String(n).padStart(2, '0');
    const head = (h > 0 || withHours) ? `${h}:${p(m)}` : p(m);
    return { main: `${head}:${p(s)}`, cs: p(cs) };
  };
  const fmtFull = ms => { const f = fmt(ms); return `${f.main}.${f.cs}`; };

  // 文字盤の目盛り
  const NS = 'http://www.w3.org/2000/svg';
  const ticks = $('ticks');
  for (let i = 0; i < 300; i++) { // 1/5秒刻み
    const major = i % 25 === 0, mid = i % 5 === 0;
    const a = i / 300 * Math.PI * 2;
    const r1 = 176, r2 = major ? 158 : mid ? 165 : 171;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', 200 + Math.sin(a) * r1); l.setAttribute('y1', 200 - Math.cos(a) * r1);
    l.setAttribute('x2', 200 + Math.sin(a) * r2); l.setAttribute('y2', 200 - Math.cos(a) * r2);
    l.setAttribute('class', 'tick' + (mid ? '' : ' minor'));
    l.setAttribute('stroke-width', major ? 2.5 : mid ? 1.4 : .7);
    ticks.appendChild(l);
    if (major) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', 200 + Math.sin(a) * 140); t.setAttribute('y', 200 - Math.cos(a) * 140);
      t.setAttribute('class', 'num'); t.textContent = i === 0 ? 60 : i / 5;
      ticks.appendChild(t);
    }
  }
  const subTicks = $('subTicks');
  for (let i = 0; i < 30; i++) {
    const a = i / 30 * Math.PI * 2, major = i % 5 === 0;
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', Math.sin(a) * 37); l.setAttribute('y1', -Math.cos(a) * 37);
    l.setAttribute('x2', Math.sin(a) * (major ? 30 : 34)); l.setAttribute('y2', -Math.cos(a) * (major ? 30 : 34));
    l.setAttribute('class', 'sub-tick'); l.setAttribute('stroke-width', major ? 1.4 : .7);
    subTicks.appendChild(l);
    if (major && i) {
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', Math.sin(a) * 22); t.setAttribute('y', -Math.cos(a) * 22);
      t.setAttribute('class', 'sub-num'); t.textContent = i;
      subTicks.appendChild(t);
    }
  }

  const secHand = $('secHand'), subHand = $('subHand');
  const readout = $('readout'), currentLap = $('currentLap');
  const btnStart = $('btnStart'), btnLap = $('btnLap'), btnReset = $('btnReset');

  function drawTime() {
    const ms = elapsed();
    const f = fmt(ms);
    readout.innerHTML = `${f.main}.<span class="cs">${f.cs}</span>`;
    secHand.setAttribute('transform', `rotate(${(ms % 60000) / 60000 * 360} 200 200)`);
    subHand.setAttribute('transform', `rotate(${(ms % 1800000) / 1800000 * 360})`);
    const last = state.laps.length ? state.laps[state.laps.length - 1] : 0;
    currentLap.innerHTML = `ラップ <b>${state.laps.length + 1}</b> · ${fmtFull(ms - last)}`;
  }

  function drawControls() {
    const ms = elapsed();
    btnStart.firstChild.textContent = running() ? 'ストップ' : (ms > 0 ? '再開' : 'スタート');
    btnLap.disabled = !running();
    btnReset.disabled = running() || ms === 0;
  }

  function drawLaps() {
    const box = $('laps'), marks = $('lapMarks');
    marks.innerHTML = '';
    if (!state.laps.length) {
      box.innerHTML = '<p class="empty">計測中に「ラップ」を押すと、区間タイムと通算タイムがここに並びます。最速は緑、最遅は赤で表示します。</p>';
      $('stats').textContent = '';
      return;
    }
    const laps = state.laps.map((split, i) => ({ n: i + 1, split, lap: split - (i ? state.laps[i - 1] : 0) }));
    let best = null, worst = null;
    if (laps.length >= 2) {
      best = laps.reduce((a, b) => b.lap < a.lap ? b : a);
      worst = laps.reduce((a, b) => b.lap > a.lap ? b : a);
    }
    const avg = laps.reduce((s, l) => s + l.lap, 0) / laps.length;
    $('stats').textContent = `平均 ${fmtFull(avg)}`;
    const rows = laps.slice().reverse().map(l => {
      const cls = l === best ? 'best' : l === worst ? 'worst' : '';
      const tag = cls === 'best' ? '<span class="tag">最速</span>' : cls === 'worst' ? '<span class="tag">最遅</span>' : '';
      return `<tr class="${cls}"><td class="idx">${String(l.n).padStart(2, '0')}</td><td class="lap">${tag}${fmtFull(l.lap)}</td><td>${fmtFull(l.split)}</td></tr>`;
    }).join('');
    box.innerHTML = `<table><thead><tr><th>No.</th><th>ラップ</th><th>通算</th></tr></thead><tbody>${rows}</tbody></table>`;
    // 文字盤の外周にラップ位置の印
    laps.forEach(l => {
      const a = (l.split % 60000) / 60000 * Math.PI * 2;
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', 200 + Math.sin(a) * 180); c.setAttribute('cy', 200 - Math.cos(a) * 180);
      c.setAttribute('r', 3); c.setAttribute('class', 'lap-mark');
      marks.appendChild(c);
    });
  }

  let raf = null;
  const loop = () => { drawTime(); raf = running() ? requestAnimationFrame(loop) : null; };

  function toggle() {
    if (running()) { state.acc = elapsed(); state.startedAt = null; }
    else { state.startedAt = Date.now(); if (!raf) raf = requestAnimationFrame(loop); }
    save(); drawControls(); drawTime();
  }
  function lap() {
    if (!running()) return;
    state.laps.push(elapsed()); save(); drawLaps(); drawTime();
  }
  function reset() {
    if (running()) return;
    state = { acc: 0, startedAt: null, laps: [] }; save();
    drawTime(); drawLaps(); drawControls();
  }

  btnStart.addEventListener('click', toggle);
  btnLap.addEventListener('click', lap);
  btnReset.addEventListener('click', reset);
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); toggle(); }
    else if (e.key === 'l' || e.key === 'L') lap();
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  // 計測中は画面が消えないようにする(許可されない環境では無視)
  let lock = null;
  const wake = async () => { try { if (running() && !lock && navigator.wakeLock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => lock = null); } } catch (e) {} };
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') wake(); });
  btnStart.addEventListener('click', wake);

  drawTime(); drawLaps(); drawControls();
  if (running()) raf = requestAnimationFrame(loop);
})();
</script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }</script>
</body>
</html>
